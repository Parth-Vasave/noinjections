repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0  # keep in sync with ruff in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Guards against accidentally committing model weights or datasets.
      - id: check-added-large-files
        args: [--maxkb=1024]
      # Whitespace fixers must never touch fixtures: they may contain
      # deliberate invisible/odd characters that the tests depend on.
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        exclude: ^tests/fixtures/

  # Self-contained (pre-commit builds it with Go); uses shellcheck for run:
  # steps when shellcheck is on PATH.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
