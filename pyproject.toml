[project]
name = "noinjections"
dynamic = ["version"]
description = "Scan websites, GitHub repositories, and local folders for indirect prompt injection."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Parth Vasave" }]
requires-python = ">=3.11"
keywords = ["prompt-injection", "security", "llm", "ai-agents", "scanner"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
# Base install = rules only. Keep it light.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "httpx>=0.27",
    "httpcore>=1.0",  # used directly by the address guard (fetchers/address_guard.py)
    "selectolax>=0.3.21",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
render = ["playwright>=1.45"]
ml = [
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "huggingface_hub>=0.23",
    "numpy>=1.26",
]
llm = ["litellm>=1.40"]
train = [
    "transformers>=4.44",
    "datasets>=2.20",
    "torch>=2.3",
    "scikit-learn>=1.5",
    "optimum>=1.21",  # verify optimum vs optimum-onnx at Checkpoint 6.2
    "sentence-transformers>=3.0",
]

[project.scripts]
noinjections = "noinjections.cli:app"
noinj = "noinjections.cli:app"  # short alias

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/noinjections/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/noinjections"]

[tool.hatch.build.targets.sdist]
include = ["src/noinjections", "tests", "README.md", "LICENSE"]
exclude = ["tests/fixtures/_materialized"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit (security)
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point of tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not network and not render"]
markers = [
    "network: hits the real internet (skipped by default; run with -m network)",
    "render: needs Playwright + Chromium (skipped by default; run with -m render)",
]
